---
services:
  db:
    container_name: db
    image: vidyasree06/vidya:db
    build: ./database/
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp
    deploy:
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 512M

  auth_services:
    container_name: auth_services
    image: vidyasree06/vidya:auth
    build: ./auth/
    ports:
      - "50001:50001"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
    depends_on:
      - db

  book_services:
    container_name: book_services
    image: vidyasree06/vidya:book
    build: ./book/
    ports:
      - "50002:50002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
    depends_on:
      - db

  borrow_services:
    container_name: borrow_services
    image: vidyasree06/vidya:borrow
    build: ./borrow/
    ports:
      - "5003:5003"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.25"
          memory: 200M
    depends_on:
      - db

  front_end:
    container_name: frontend
    image: vidyasree06/vidya:frontend
    build: .
    ports:
      - "5000:5000"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.25"
          memory: 200M

networks:
  myapp:
    driver: overlay
    attachable: true

volumes:
  mydata:
